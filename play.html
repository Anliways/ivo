<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>试玩 Demo - IVOIncubator</title>
<meta name="description" content="IVOIncubator 像素小游戏试玩 Demo。">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/emoji.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080a">
<link rel="preload" as="font" type="font/woff2" href="assets/FusionPixel12-subset.woff2" crossorigin>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="play.css">
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="shell topbar-in">
    <a class="logo-link" href="index.html">
      <img src="assets/logo.png" alt="IVOIncubator">
    </a>
    <nav class="topnav">
      <a href="index.html" id="backLink" data-i18n="navBack">返回详情</a>
    </nav>
    <div class="topbar-tools">
      <a class="play-exit" id="exitLink" href="game.html" aria-label="退出试玩">✕</a>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">
        <span class="lang-zh">ZH</span><span class="lang-sep">/</span><span class="lang-en">EN</span>
      </button>
    </div>
  </div>
</header>

<main class="shell play-page">

  <!-- ===== 标题 ===== -->
  <section class="play-head">
    <h1 id="playTitle"></h1>
    <p class="play-sub" id="playSub"></p>
  </section>

  <!-- ===== 游戏区 ===== -->
  <section class="play-stage" id="stage">
    <canvas id="gameCanvas" width="240" height="320"></canvas>
    <div class="play-overlay show" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="play-btns">
        <button class="btn btn-blue" id="ovAction" type="button"></button>
        <a class="btn btn-ghost" id="ovBack" href="game.html" data-i18n="backBtn"></a>
      </div>
    </div>
  </section>
  <div class="play-hud">
    <span><span data-i18n="scoreLabel">得分</span><b id="scoreVal">0</b></span>
    <span><span data-i18n="bestLabel">最高分</span><b id="bestVal">0</b></span>
  </div>
  <p class="play-hint" id="playHint"></p>

</main>

<script src="data.js"></script>
<script src="analytics.js"></script>
<script src="play.js"></script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    const el = document.createElement("div");
    el.className = "toast show";
    el.textContent = document.documentElement.dataset.lang === "en" ? "✨ Updated to the latest version" : "✨ 已更新到最新版本";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  });
}
</script>
</body>
</html>
