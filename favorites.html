<!-- ===== 顶栏 ===== -->

    </nav>
    <div class="topbar-tools">
      <a class="fav-link active" href="favorites.html" aria-label="我的收藏" data-i18n-aria="navFavs">♥<b class="fav-badge" data-fav-badge>0</b></a>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">

</header>

<main class="shell favs-page">

  <section class="favs-head">
    <h1 data-i18n="favTitle">我的收藏</h1>
    <span class="fav-total" id="favTotal">♥ 0</span>
    <button type="button" class="btn btn-ghost btn-sm" id="clearBtn" hidden data-i18n="favClear">清空收藏</button>
  </section>
  <p class="favs-hint" data-i18n="favHint">点击卡片右上角 ♥ 取消收藏</p>

  <div class="fav-sort" id="favSort" role="group" aria-label="排序方式">
    <button type="button" class="chip active" data-sort="added" data-i18n="sortAdded">按收藏顺序</button>
    <button type="button" class="chip" data-sort="rating" data-i18n="sortRating">评分优先</button>
  </div>

  <div class="game-grid" id="favGrid"></div>

  <div class="favs-empty" id="favsEmpty" hidden>
    <div class="favs-empty-icon">🎮</div>
    <h2 data-i18n="favEmpty">还没有收藏任何游戏</h2>
    <p data-i18n="favEmptyHint">去首页逛逛,点卡片右上角的 ♡ 把喜欢的游戏收进来!</p>
    <a class="btn btn-blue" href="index.html#grid-top" data-i18n="favGo">去发现游戏</a>
  </div>

</main>

      </div>
      <div>

        <ul>
          <li><a href="#" data-link="live" target="_blank" rel="noopener" data-i18n="footLive">游戏实况</a></li>
          <li><a href="mailto:support@ivoIncubator.com" class="footer-mail">support@ivoIncubator.com</a></li>

          <li><a href="#" data-link="youtube" target="_blank" rel="noopener">YouTube</a></li>

    </div>
    <p class="footer-bottom">© 2026 IVOIncubator · <span data-i18n="footRights">精品手机游戏之家</span></p>
  </div>
</footer>

<button class="back-top" id="backTop" type="button" aria-label="Back to top" data-i18n-aria="backTop">▲</button>

<script src="data.js"></script>
<script src="cursor.js"></script>
<script src="analytics.js"></script>
<script src="favorites.js"></script>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  // 新版本 SW 接管时给个像素提示(首次注册不提示)
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    const el = document.createElement("div");
    el.className = "toast show";
    el.textContent = document.documentElement.dataset.lang === "en" ? "✨ Updated to the latest version" : "✨ 已更新到最新版本";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  });
}
</script>
</body>
</html>
